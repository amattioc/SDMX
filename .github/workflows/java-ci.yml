name: Build & Draft release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-java:
    runs-on: ubuntu-latest
    outputs:
      sdmx_version: ${{ steps.read-version.outputs.sdmx_version }}

    steps:
      - name: Set up JDK 11 for x64
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64

      - name: Setup Ant
        uses: cedx/setup-ant@v7.1.0
        with:
          version: '1.10.9'

      - name: Repository checkout
        uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          cd JAVA && ant clean dist

      - name: Read VERSION
        id: read-version
        run: |
          echo "sdmx_version=$(tr -d '\r\n' < JAVA/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create STATA / EXCEL tarballs
        run: |
          mkdir -p JAVA/dist
          tar -C STATA -czf JAVA/dist/statasdmx.tar.gz .
          tar -C EXCEL -czf JAVA/dist/excelsdmx.tar.gz .

      - name: Upload SDMX JAR
        uses: actions/upload-artifact@v7.0.0
        with:
          name: sdmx-jar
          path: JAVA/dist/lib/SDMX.jar
          archive: false
          overwrite: true
          if-no-files-found: error

      - name: Upload STATA package
        uses: actions/upload-artifact@v7.0.0
        with:
          name: statasdmx
          path: JAVA/dist/statasdmx.tar.gz
          archive: false
          overwrite: true
          if-no-files-found: error

      - name: Upload EXCEL package
        uses: actions/upload-artifact@v7.0.0
        with:
          name: excelsdmx
          path: JAVA/dist/excelsdmx.tar.gz
          archive: false
          overwrite: true
          if-no-files-found: error

  test-r:
    needs: build-java
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 11 for x64
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SDMX JAR
        uses: actions/download-artifact@v8.0.1
        with:
          name: SDMX.jar
          path: RJSDMX/inst/java

      - name: Apply VERSION
        run: |
          sed "s/%%VERSION%%/${{ needs.build-java.outputs.sdmx_version }}/" DESCRIPTION.template > RJSDMX/DESCRIPTION

      - name: Setup tinytex for R manuals
        uses: r-lib/actions/setup-tinytex@v2

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::./RJSDMX
          extra-packages: any::RUnit

      - name: Build R package
        run: |
          R CMD build ./RJSDMX
          TARBALL="$(find . -maxdepth 1 -type f -name 'RJSDMX*.tar.gz' -print -quit)"
          if [ -z "${TARBALL}" ]; then exit 1; fi
          R CMD check --as-cran --no-tests "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Run R Tests
        run: |
          R CMD INSTALL "${TARBALL}"
          Rscript -e "library(RUnit); library(RJSDMX); runTestFile('RJSDMX/R/test_automation/test.sdmx.r')"

      - name: Upload R package artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: cran-package
          path: ${{ env.TARBALL }}
          archive: false
          if-no-files-found: error

  test-matlab:
    needs: build-java
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [R2024a, R2026b]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Download SDMX JAR
        uses: actions/download-artifact@v8.0.1
        with:
          name: SDMX.jar
          path: MATLAB/files/lib

      - name: Set up JDK 11 for x64
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3.0.1
        with:
          release: ${{ matrix.release }}
          cache: true

      - name: Set up Java for MATLAB
        run: |
          matlab_bin="$(readlink -f "$(command -v matlab)")"
          matlab_root="$(dirname "$(dirname "$matlab_bin")")"
          "$matlab_root/bin/glnxa64/matlab_jenv" "$JAVA_HOME"

      - name: Test and build toolbox
        uses: matlab-actions/run-build@v3.4.0
        with:
          startup-options: -sd MATLAB
          tasks: 'archive("${{ needs.build-java.outputs.sdmx_version }}")'

      - name: Check Installation
        uses: matlab-actions/run-command@v3
        with:
          command: >
            tbx = fullfile("MATLAB", "MatSDMX.mltbx");
            if isMATLABReleaseOlderThan('R2026b'), matlab.addons.install(tbx); else, mpminstall(tbx, Prompt = false); end,            
            ver('sdmx').Version,
            assert(contains(which("sdmxHelp"),'MATLAB Add-Ons')),
            assert( ~isempty(getFlows('ECB')) )

      - name: Upload MATLAB toolbox artifact
        if: matrix.release == 'R2026b'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: matlab-toolbox
          path: MATLAB/MatSDMX.mltbx
          archive: false
          if-no-files-found: error

  draft-release:
    needs: [build-java, test-r, test-matlab]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Update latest tag
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: "tags/latest"
              });

              await github.rest.git.updateRef({
                owner,
                repo,
                ref: "tags/latest",
                sha,
                force: true
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: "refs/tags/latest",
                  sha
                });
              } else {
                throw error;
              }
            }

      - name: Create or update latest draft release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: latest
          name: latest
          commit: ${{ github.sha }}
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: false
          artifacts: "release-assets/*"
