
name: JAVA CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
    build-java:
      runs-on: ubuntu-latest

      steps:
        - name: Set up JDK 11 for x64
          uses: actions/setup-java@v5.2.0
          with:
            java-version: '11'
            distribution: 'temurin'
            architecture: x64

        - name: Setup Ant
          uses: cedx/setup-ant@v6.1.0
          with:
            version: '1.10.9'
          
        - name: Repository checkout
          uses: actions/checkout@v6.0.2

        - name: Build
          run: |
            cd JAVA && ant clean dist

        - name: Create STATA / EXCEL / SAS tarballs
          run: |
            mkdir -p JAVA/dist
            tar -C STATA -czf JAVA/dist/statasdmx.tar.gz .
            tar -C EXCEL -czf JAVA/dist/excelsdmx.tar.gz .
            tar -C SAS   -czf JAVA/dist/sassdmx.tar.gz .

        - name: Upload VERSION
          uses: actions/upload-artifact@v7.0.0
          with:
            name: sdmx-jar
            path: JAVA/VERSION
            archive: false
            overwrite: true
            if-no-files-found: error
  
        - name: Upload SDMX JAR
          uses: actions/upload-artifact@v7.0.0
          with:
            name: sdmx-jar
            path: JAVA/dist/lib/SDMX.jar
            archive: false
            overwrite: true
            if-no-files-found: error
  
        - name: Upload STATA package
          uses: actions/upload-artifact@v7.0.0
          with:
            name: statasdmx
            path: JAVA/dist/statasdmx.tar.gz
            archive: false
            overwrite: true
            if-no-files-found: error
  
        - name: Upload EXCEL package
          uses: actions/upload-artifact@v7.0.0
          with:
            name: excelsdmx
            path: JAVA/dist/excelsdmx.tar.gz
            archive: false
            overwrite: true
            if-no-files-found: error
  
        - name: Upload SAS package
          uses: actions/upload-artifact@v7.0.0
          with:
            name: sassdmx
            path: JAVA/dist/sassdmx.tar.gz
            archive: false
            overwrite: true
            if-no-files-found: error
